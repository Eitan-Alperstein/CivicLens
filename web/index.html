<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicLens</title>
    <script src="./app.js" defer></script>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="hero">
        <h1>CivicLens</h1>
        <h2>Your city. Your questions. The facts.</h2>
        <form action="" class="search-form" id="search-form">
            <input type="text" class="search-input" placeholder="Ask about Colorado or Denver…" >
            <input type="submit">
            <div class="samples">
                <button class="sample-chip" type="button"><i>What is Denver doing to address homelessness?</i></button>
                <button class="sample-chip" type="button"><i>How is the city spending money on public transportation?</i></button>
                <button class="sample-chip" type="button"><i>What changes is Denver considering for affordable housing?</i></button>
                <button class="sample-chip" type="button"><i>What has the city decided about water conservation?</i></button>
            </div>
        </form>
    </header>
    <main>
        <div class="overview" hidden>
            <h3>AI Overview</h3>
            <div class="overview-text"></div>
        </div>
        <div class="results"></div>
        <p class="empty" hidden>Whoops! We couldn't find any results for that topic.</p>
    </main>
</body>
</html>
